<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhe do Filme — CineLog</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Estilos próprios -->
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

  <!-- ▸ HEADER ──────────────────────────────────────────────────────────────── -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon">▶</div>
        Cine<span>Log</span>
      </a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html#catalogo">Catálogo</a></li>
          <li><a href="index.html#sobre">Sobre</a></li>
        </ul>
      </nav>
    </div>

  <!-- ▸ HERO COM IMAGEM DE FUNDO ───────────────────────────────────────────── -->
  <div class="detalhe-hero" id="detalhe-hero">
    <div class="hero-text container">
      <span class="slide-genero" id="hero-genero"></span>
      <h1 id="hero-titulo"></h1>
    </div>
  </div>

  <!-- ▸ SEÇÃO 1 — INFORMAÇÕES GERAIS ─────────────────────────────────────── -->
  <section class="info-geral" id="detalhe-container">

      <div class="section-header">
        <h2 class="section-titulo">Informações Gerais</h2>
        <div class="section-linha"></div>
      </div>
      <!-- Preenchido via JS -->
      <div class="info-grid" id="info-container"></div>
    </div>
  </section>

  <!-- ▸ SEÇÃO 2 — FOTOS VINCULADAS ────────────────────────────────────────── -->
  <section class="fotos">
    <div class="container">
      <div class="section-header">
        <h2 class="section-titulo">Galeria de Cenas</h2>
        <div class="section-linha"></div>
      </div>
      <div class="row g-3" id="fotos-container"></div>
    </div>
  </section>

  <!-- ▸ FOOTER ─────────────────────────────────────────────────────────────── -->
  <footer>
    <p>© 2025 <span>CineLog</span> — Trabalho Prático 1 &nbsp;·&nbsp; Desenvolvido com Bootstrap 5 &amp; JavaScript</p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
